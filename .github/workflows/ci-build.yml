name: CI - Builds

on:
  push:
    branches: [main, dev, feature/**]
  pull_request:
    branches: [main, dev]

jobs:
  api:
    if: github.repository != 'Guillaume-Reboullet/MSc-Time-Manager'
    name: API builds
    runs-on: self-hosted

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Build API
        run: npm run build
  backoffice:
    if: github.repository != 'Guillaume-Reboullet/MSc-Time-Manager'
    name: Backoffice builds
    runs-on: self-hosted

    defaults:
      run:
        working-directory: backoffice

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backoffice/package-lock.json

      - name: Install Backoffice dependencies
        run: npm ci

      - name: Build Backoffice
        run: npm run build
  portal:
    if: github.repository != 'Guillaume-Reboullet/MSc-Time-Manager'
    name: Portal builds
    runs-on: self-hosted

    defaults:
      run:
        working-directory: portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install Portal dependencies
        run: npm ci

      - name: Build Portal
        run: npm run build
