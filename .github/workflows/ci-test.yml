name: CI - Tests

on:
  workflow_run:
    workflows: ["CI - Builds"]
    types: [completed]

permissions:
  contents: write

jobs:
  api:
    if: >-
      github.repository != 'Guillaume-Reboullet/MSc-Time-Manager' &&
      github.event.workflow_run.conclusion == 'success'
    name: API tests and coverage
    runs-on: self-hosted

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Run API unit tests with coverage
        run: npm run test:cov

      - name: Run API e2e tests with coverage
        run: npm run test:e2e:cov

      - name: Trigger private repository sync
        if: >-
          success() &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'dev'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GitHub token is not available"
            exit 1
          fi

          jq -n \
            --arg branch "$SOURCE_BRANCH" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            '{
              event_type: "tests-passed",
              client_payload: {
                branch: $branch,
                source_sha: $source_sha,
                source_repository: $source_repository
              }
            }' |
            curl --fail --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data-binary @- \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches"
