name: Sync Private Repository

on:
  repository_dispatch:
    types: [tests-passed]

permissions:
  contents: read

concurrency:
  group: sync-private-repository
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository != 'Guillaume-Reboullet/MSc-Time-Manager' &&
      github.event.client_payload.source_repository == github.repository &&
      (
        github.event.client_payload.branch == 'main' ||
        github.event.client_payload.branch == 'dev'
      )
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.source_sha }}
          path: source
          persist-credentials: false

      - name: Checkout private repository
        uses: actions/checkout@v7
        with:
          repository: Guillaume-Reboullet/MSc-Time-Manager
          ref: ${{ github.event.client_payload.branch }}
          token: ${{ secrets.GH_PAT }}
          path: destination

      - name: Install rsync
        run: |
          if command -v rsync >/dev/null 2>&1; then
            exit 0
          fi

          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y rsync
          else
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

      - name: Sync code
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            source/ destination/

      - name: Commit and push
        working-directory: destination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to sync"
            exit 0
          fi

          git commit -m "Sync from $GITHUB_REPOSITORY"
          git push origin "HEAD:refs/heads/${{ github.event.client_payload.branch }}"

      - name: Trigger security gate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_BRANCH: ${{ github.event.client_payload.branch }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT is not configured"
            exit 1
          fi

          jq -n \
            --arg branch "$TARGET_BRANCH" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            '{
              event_type: "sync-complete",
              client_payload: {
                branch: $branch,
                source_sha: $source_sha,
                source_repository: $source_repository
              }
            }' |
            curl --fail --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data-binary @- \
              "https://api.github.com/repos/Guillaume-Reboullet/MSc-Time-Manager/dispatches"
